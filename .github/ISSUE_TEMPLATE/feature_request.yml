name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you would like it to work.
    validations:
      required: true
  - type: dropdown
    id: shape
    attributes:
      label: Could it be optional?
      description: We prefer settings, plugins and extension points over changing behaviour for everyone.
      options:
        - It could be a setting
        - It could be a plugin or extension
        - It needs to change the default behaviour
        - Not sure
